name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -q LiveScorePuy_FIXED.zip -d project
          echo "Project files:"
          find project -maxdepth 4 -type f | head -100

      - name: Find Android project
        run: |
          SETTINGS=$(find project -name settings.gradle.kts -o -name settings.gradle | head -1)

          if [ -n "$SETTINGS" ]; then
            PROJECT_DIR=$(dirname "$SETTINGS")
          else
            BUILD_FILE=$(find project -name build.gradle.kts -o -name build.gradle | head -1)

            if [ -z "$BUILD_FILE" ]; then
              echo "ERROR: File Gradle Android tidak ditemukan di dalam ZIP"
              exit 1
            fi

            PROJECT_DIR=$(dirname "$BUILD_FILE")
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project ditemukan di: $PROJECT_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LiveScorePuy-APK
          path: 'project/**/build/outputs/apk/**/*.apk'
